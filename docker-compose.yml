services:
  postgres:
    image: postgres:16-alpine
    container_name: kickbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kickbot
      POSTGRES_PASSWORD: kickbot
      POSTGRES_DB: kickbot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kickbot -d kickbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    container_name: kickbot-migrate
    restart: "no"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://kickbot:kickbot@postgres:5432/kickbot?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["npm", "run", "prisma:migrate:deploy"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kickbot-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://kickbot:kickbot@postgres:5432/kickbot?schema=public
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
